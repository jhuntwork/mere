name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-24.04
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    container:
      image: mere/ci:v0.18.6
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Test
        run: |
          cd "$GITHUB_WORKSPACE"
          zig build test --summary all
