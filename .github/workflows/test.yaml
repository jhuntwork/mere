name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    container:
      image: mere/ci:v0.15.0
    steps:
      - name: Git checkout
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE"
          archive="$RUNNER_TEMP/mere-source.tar.gz"
          curl -fsSL \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/$GITHUB_REF.tar.gz" \
            -o "$archive"
          tar -xzf "$archive" \
            --strip-components=1 \
            -C "$GITHUB_WORKSPACE"
      - name: Test
        run: |
          cd "$GITHUB_WORKSPACE"
          zig build test --summary all
