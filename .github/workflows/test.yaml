name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-24.04
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    container:
      image: mere/ci:v0.18.6
    steps:
      - name: Git checkout
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE"
          archive="$RUNNER_TEMP/mere-source.tar.gz"
          curl -fsSL \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/$GITHUB_REF.tar.gz" \
            -o "$archive"
          tar -xzf "$archive" \
            --strip-components=1 \
            -C "$GITHUB_WORKSPACE"
      - name: Test
        run: |
          cd "$GITHUB_WORKSPACE"
          zig build test --summary all
