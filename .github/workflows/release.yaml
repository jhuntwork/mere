name: Release Mere

on:
  push:
    branches:
      - main
    paths:
      - build.zig.zon
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-24.04-arm
    container:
      image: mere/ci:v0.15.0
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      version_changed: ${{ steps.meta.outputs.version_changed }}
      version: ${{ steps.meta.outputs.version }}
      old_version: ${{ steps.meta.outputs.old_version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      changelog: ${{ steps.meta.outputs.changelog }}
    steps:
      - name: Git checkout
        run: |
          set -eu
          git init "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git"
          git fetch --tags origin
          git fetch --depth=50 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Detect version change
        id: meta
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"

          previous_file=
          if git rev-parse --verify "$GITHUB_SHA^" >/dev/null 2>&1; then
            git show "$GITHUB_SHA^:build.zig.zon" > previous-build.zig.zon
            previous_file=previous-build.zig.zon
          fi

          sh .forgejo/scripts/release-ci.sh detect-version-change build.zig.zon "$previous_file" \
            >> "$GITHUB_OUTPUT"

          changelog=$(sh .forgejo/scripts/release-ci.sh changelog)
          {
            printf 'changelog<<EOF\n'
            printf '%s\n' "$changelog"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: No release needed
        if: ${{ steps.meta.outputs.version_changed != 'true' }}
        run: echo "build.zig.zon changed, but .version did not change."

  test:
    needs: detect
    if: needs.detect.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04-arm
    container:
      image: mere/ci:v0.15.0
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Git checkout
        run: |
          set -eu
          git init "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Test
        run: |
          cd "$GITHUB_WORKSPACE"
          zig build test --summary all

  release-x86_64:
    needs: [detect, test]
    if: needs.detect.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04
    container:
      image: mere/ci:v0.15.0
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      checksum: ${{ steps.build.outputs.checksum }}
    steps:
      - name: Git checkout
        run: |
          set -eu
          git init "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git"
          git fetch --depth=50 --tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Build and package
        id: build
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"

          version="${{ needs.detect.outputs.version }}"
          arch=$(uname -m)
          base=$(sh .forgejo/scripts/release-ci.sh asset-base "$version" linux "$arch")

          zig build -Doptimize=ReleaseSmall
          mkdir -p dist
          cp zig-out/bin/mere "dist/${base}"

          checksum=$(cd dist && sha256sum "$base")
          printf 'checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"

      - name: Push release tag
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"

          git config user.name "Mere CI"
          git config user.email "no-reply@merelinux.org"

          tag="${{ needs.detect.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            printf 'Tag %s already exists on origin.\n' "$tag"
            exit 0
          fi

          git tag -a "$tag" -m "${{ needs.detect.outputs.release_name }}" "$GITHUB_SHA"
          git push origin "refs/tags/${tag}"

      - name: Create release and upload assets
        env:
          CHANGELOG: ${{ needs.detect.outputs.changelog }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"

          api_base="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases"
          auth_header="Authorization: Bearer $GH_TOKEN"
          tag="$TAG"
          version="$VERSION"

          release_status=$(
            curl -sS \
              -o release.json \
              -w '%{http_code}' \
              -H "$auth_header" \
              -H "Accept: application/vnd.github+json" \
              "$api_base/tags/$tag"
          )

          case "$release_status" in
            200)
              printf 'Release %s already exists; reusing it.\n' "$tag"
              ;;
            404)
              python3 .forgejo/scripts/release-body.py > release-create.json
              curl -fsS \
                -X POST \
                -H "$auth_header" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                --data-binary @release-create.json \
                "$api_base" > release.json
              ;;
            *)
              printf 'Failed to query release %s (HTTP %s).\n' "$tag" "$release_status" >&2
              cat release.json >&2
              exit 1
              ;;
          esac

          release_id=$(python3 -c 'import json; print(json.load(open("release.json"))["id"])')
          upload_url=$(python3 -c 'import json; print(json.load(open("release.json"))["upload_url"].split("{")[0])')
          [ -n "$release_id" ] && [ -n "$upload_url" ] || {
            printf '%s\n' "Failed to parse release upload information from API response." >&2
            cat release.json >&2
            exit 1
          }

          for asset in dist/*; do
            name=$(basename "$asset")
            status=$(
              curl -sS \
                -o upload.json \
                -w '%{http_code}' \
                -X POST \
                -H "$auth_header" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$asset" \
                "$upload_url?name=$name&label=$name"
            )

            case "$status" in
              201)
                printf 'Uploaded %s\n' "$name"
                ;;
              422)
                printf 'Asset %s may already exist; refusing to replace it.\n' "$name" >&2
                cat upload.json >&2
                exit 1
                ;;
              *)
                printf 'Failed to upload %s (HTTP %s).\n' "$name" "$status" >&2
                cat upload.json >&2
                exit 1
                ;;
            esac
          done

  release-aarch64:
    needs: [detect, test, release-x86_64]
    if: needs.detect.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04-arm
    container:
      image: mere/ci:v0.15.0
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      checksum: ${{ steps.build.outputs.checksum }}
    steps:
      - name: Git checkout
        run: |
          set -eu
          git init "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git"
          git fetch --depth=50 --tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Build and package
        id: build
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"

          version="${{ needs.detect.outputs.version }}"
          arch=$(uname -m)
          base=$(sh .forgejo/scripts/release-ci.sh asset-base "$version" linux "$arch")

          zig build -Doptimize=ReleaseSmall
          mkdir -p dist
          cp zig-out/bin/mere "dist/${base}"

          checksum=$(cd dist && sha256sum "$base")
          printf 'checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"

      - name: Upload asset
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"

          api_base="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases"
          auth_header="Authorization: Bearer $GH_TOKEN"
          tag="${{ needs.detect.outputs.tag }}"
          curl -fsS \
            -H "$auth_header" \
            -H "Accept: application/vnd.github+json" \
            "$api_base/tags/$tag" > release.json

          release_id=$(python3 -c 'import json; print(json.load(open("release.json"))["id"])')
          upload_url=$(python3 -c 'import json; print(json.load(open("release.json"))["upload_url"].split("{")[0])')
          asset="dist/$(basename dist/*)"
          name=$(basename "$asset")
          status=$(
            curl -sS \
              -o upload.json \
              -w '%{http_code}' \
              -X POST \
              -H "$auth_header" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$asset" \
              "$upload_url?name=$name&label=$name"
          )

          case "$status" in
            201)
              printf 'Uploaded %s\n' "$name"
              ;;
            422)
              printf 'Asset %s may already exist; refusing to replace it.\n' "$name" >&2
              cat upload.json >&2
              exit 1
              ;;
            *)
              printf 'Failed to upload %s (HTTP %s).\n' "$name" "$status" >&2
              cat upload.json >&2
              exit 1
              ;;
          esac

  checksums:
    needs: [detect, release-x86_64, release-aarch64]
    if: needs.detect.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04-arm
    container:
      image: mere/ci:v0.15.0
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Upload SHA256SUMS
        env:
          X86_CHECKSUM: ${{ needs.release-x86_64.outputs.checksum }}
          AARCH64_CHECKSUM: ${{ needs.release-aarch64.outputs.checksum }}
        run: |
          set -eu

          printf '%s\n' "$X86_CHECKSUM" "$AARCH64_CHECKSUM" > SHA256SUMS

          api_base="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases"
          auth_header="Authorization: Bearer $GH_TOKEN"
          tag="${{ needs.detect.outputs.tag }}"
          curl -fsS \
            -H "$auth_header" \
            -H "Accept: application/vnd.github+json" \
            "$api_base/tags/$tag" > release.json

          upload_url=$(python3 -c 'import json; print(json.load(open("release.json"))["upload_url"].split("{")[0])')
          status=$(
            curl -sS \
              -o upload.json \
              -w '%{http_code}' \
              -X POST \
              -H "$auth_header" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @SHA256SUMS \
              "$upload_url?name=SHA256SUMS&label=SHA256SUMS"
          )

          case "$status" in
            201)
              printf 'Uploaded SHA256SUMS\n'
              ;;
            422)
              printf '%s\n' 'SHA256SUMS may already exist; refusing to replace it.' >&2
              cat upload.json >&2
              exit 1
              ;;
            *)
              printf 'Failed to upload SHA256SUMS (HTTP %s).\n' "$status" >&2
              cat upload.json >&2
              exit 1
              ;;
          esac
