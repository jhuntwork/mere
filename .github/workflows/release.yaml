name: Release Mere

on:
  push:
    branches:
      - main
    paths:
      - build.zig.zon
  workflow_dispatch:
    inputs:
      force_release:
        description: Force the detected version to release (used for recovery)
        required: false
        type: boolean
        default: false
      tag_override:
        description: Override the release tag (used for recovery)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-24.04-arm
    container:
      image: mere/ci:v0.18.6
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      version_changed: ${{ steps.meta.outputs.version_changed }}
      version: ${{ steps.meta.outputs.version }}
      old_version: ${{ steps.meta.outputs.old_version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      changelog: ${{ steps.meta.outputs.changelog }}
    steps:
      - name: Git checkout
        run: |
          set -eu
          git init "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git"
          git fetch --tags origin
          git fetch --depth=50 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Detect version change
        id: meta
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"

          previous_file=
          if git rev-parse --verify "$GITHUB_SHA^" >/dev/null 2>&1; then
            git show "$GITHUB_SHA^:build.zig.zon" > previous-build.zig.zon
            previous_file=previous-build.zig.zon
          fi

          metadata=$(mktemp)
          sh .github/scripts/release-ci.sh detect-version-change build.zig.zon "$previous_file" \
            > "$metadata"
          cat "$metadata" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.force_release }}" = "true" ]; then
            printf 'version_changed=true\n' >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ inputs.tag_override }}" ]; then
            printf 'tag=%s\n' "${{ inputs.tag_override }}" >> "$GITHUB_OUTPUT"
          fi

          changelog=$(sh .github/scripts/release-ci.sh changelog)
          {
            printf 'changelog<<EOF\n'
            printf '%s\n' "$changelog"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: No release needed
        if: ${{ steps.meta.outputs.version_changed != 'true' }}
        run: echo "build.zig.zon changed, but .version did not change."

  test:
    name: Release test (${{ matrix.arch }})
    needs: detect
    if: needs.detect.outputs.version_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-24.04
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    container:
      image: mere/ci:v0.18.6
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Git checkout
        run: |
          set -eu
          git init "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Test
        run: |
          cd "$GITHUB_WORKSPACE"
          zig build test --summary all

  create-release:
    needs: [detect, test]
    if: needs.detect.outputs.version_changed == 'true'
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    runs-on: ubuntu-24.04
    container:
      image: mere/ci:v0.18.6
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Git checkout
        run: |
          set -eu
          git init "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git"
          git fetch --depth=50 --tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Push release tag
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"

          git config user.name "Mere CI"
          git config user.email "no-reply@merelinux.org"

          tag="${{ needs.detect.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            printf 'Tag %s already exists on origin.\n' "$tag"
          else
            git tag -a "$tag" -m "${{ needs.detect.outputs.release_name }}" "$GITHUB_SHA"
            git push origin "refs/tags/${tag}"
          fi

      - name: Create draft release
        id: release
        env:
          CHANGELOG: ${{ needs.detect.outputs.changelog }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"

          api_base="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases"
          auth_header="Authorization: Bearer $GH_TOKEN"
          tag="$TAG"

          release_status=$(
            curl -sS \
              -o release.json \
              -w '%{http_code}' \
              -H "$auth_header" \
              -H "Accept: application/vnd.github+json" \
              "$api_base/tags/$tag"
          )

          case "$release_status" in
            200)
              immutable=$(python3 -c 'import json; print(json.load(open("release.json")).get("immutable", False))')
              draft=$(python3 -c 'import json; print(json.load(open("release.json"))["draft"])')
              if [ "$immutable" = "True" ] || [ "$draft" != "True" ]; then
                printf 'Release %s already exists and cannot be reused safely (immutable=%s draft=%s).\n' "$tag" "$immutable" "$draft" >&2
                exit 1
              fi
              printf 'Draft release %s already exists; reusing it.\n' "$tag"
              ;;
            404)
              releases_status=$(
                curl -sS \
                  -o releases.json \
                  -w '%{http_code}' \
                  -H "$auth_header" \
                  -H "Accept: application/vnd.github+json" \
                  "$api_base?per_page=100"
              )
              if [ "$releases_status" = "200" ]; then
                draft_id=$(python3 -c 'import json,sys; tag=sys.argv[1]; releases=json.load(open("releases.json")); matches=[r for r in releases if r.get("tag_name") == tag]; print(matches[0]["id"] if matches else "")' "$tag")
              else
                draft_id=
              fi
              if [ -n "$draft_id" ]; then
                curl -fsS \
                  -H "$auth_header" \
                  -H "Accept: application/vnd.github+json" \
                  "$api_base/$draft_id" > release.json
                immutable=$(python3 -c 'import json; print(json.load(open("release.json")).get("immutable", False))')
                draft=$(python3 -c 'import json; print(json.load(open("release.json"))["draft"])')
                if [ "$immutable" = "True" ] || [ "$draft" != "True" ]; then
                  printf 'Release %s exists but is not a mutable draft.\n' "$tag" >&2
                  exit 1
                fi
                printf 'Found existing draft release %s; reusing it.\n' "$tag"
              else
                python3 .github/scripts/release-body.py > release-create.json
                python3 -c 'import json; from pathlib import Path; path = Path("release-create.json"); body = json.loads(path.read_text()); body["draft"] = True; path.write_text(json.dumps(body))'
                curl -fsS \
                  -X POST \
                  -H "$auth_header" \
                  -H "Accept: application/vnd.github+json" \
                  -H "Content-Type: application/json" \
                  --data-binary @release-create.json \
                  "$api_base" > release.json
                printf 'Created draft release %s.\n' "$tag"
              fi
              ;;
            *)
              printf 'Failed to query release %s (HTTP %s).\n' "$tag" "$release_status" >&2
              cat release.json >&2
              exit 1
              ;;
          esac

          release_id=$(python3 -c 'import json; print(json.load(open("release.json"))["id"])')
          upload_url=$(python3 -c 'import json; print(json.load(open("release.json"))["upload_url"].split("{")[0])')
          printf 'release_id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"
          printf 'upload_url=%s\n' "$upload_url" >> "$GITHUB_OUTPUT"

  release-x86_64:
    needs: [detect, test, create-release]
    if: needs.detect.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04
    container:
      image: mere/ci:v0.18.6
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      checksum: ${{ steps.build.outputs.checksum }}
    steps:
      - name: Git checkout
        run: |
          set -eu
          git init "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git"
          git fetch --depth=50 --tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Build and package
        id: build
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"

          version="${{ needs.detect.outputs.version }}"
          arch=$(uname -m)
          base=$(sh .github/scripts/release-ci.sh asset-base "$version" linux "$arch")

          zig build -Doptimize=ReleaseSmall
          mkdir -p dist
          cp zig-out/bin/mere "dist/${base}"

          checksum=$(cd dist && sha256sum "$base")
          printf 'checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"

      - name: Upload x86_64 asset to draft release
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"

          api_base="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases"
          auth_header="Authorization: Bearer $GH_TOKEN"
          release_id="${{ needs.create-release.outputs.release_id }}"
          upload_url="${{ needs.create-release.outputs.upload_url }}"
          curl -fsS \
            -H "$auth_header" \
            -H "Accept: application/vnd.github+json" \
            "$api_base/$release_id" > release.json

          asset="dist/$(basename dist/*)"
          name=$(basename "$asset")
          existing_id=$(python3 -c 'import json,sys; assets=json.load(open("release.json"))["assets"]; print(next((str(a["id"]) for a in assets if a["name"] == sys.argv[1]), ""))' "$name")
          if [ -n "$existing_id" ]; then
            printf 'Replacing existing draft asset %s.\n' "$name"
            curl -fsS -X DELETE \
              -H "$auth_header" \
              -H "Accept: application/vnd.github+json" \
              "$api_base/assets/$existing_id"
          fi

          status=$(
            curl -sS \
              -o upload.json \
              -w '%{http_code}' \
              -X POST \
              -H "$auth_header" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$asset" \
              "$upload_url?name=$name&label=$name"
          )

          case "$status" in
            201) printf 'Uploaded %s\n' "$name" ;;
            *) printf 'Failed to upload %s (HTTP %s).\n' "$name" "$status" >&2; cat upload.json >&2; exit 1 ;;
          esac

  release-aarch64:
    needs: [detect, test, create-release]
    if: needs.detect.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04-arm
    container:
      image: mere/ci:v0.18.6
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      checksum: ${{ steps.build.outputs.checksum }}
    steps:
      - name: Git checkout
        run: |
          set -eu
          git init "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git"
          git fetch --depth=50 --tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Build and package
        id: build
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"

          version="${{ needs.detect.outputs.version }}"
          arch=$(uname -m)
          base=$(sh .github/scripts/release-ci.sh asset-base "$version" linux "$arch")

          zig build -Doptimize=ReleaseSmall
          mkdir -p dist
          cp zig-out/bin/mere "dist/${base}"

          checksum=$(cd dist && sha256sum "$base")
          printf 'checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"

      - name: Upload aarch64 asset to draft release
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"

          api_base="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases"
          auth_header="Authorization: Bearer $GH_TOKEN"
          release_id="${{ needs.create-release.outputs.release_id }}"
          upload_url="${{ needs.create-release.outputs.upload_url }}"
          curl -fsS \
            -H "$auth_header" \
            -H "Accept: application/vnd.github+json" \
            "$api_base/$release_id" > release.json

          asset="dist/$(basename dist/*)"
          name=$(basename "$asset")
          existing_id=$(python3 -c 'import json,sys; assets=json.load(open("release.json"))["assets"]; print(next((str(a["id"]) for a in assets if a["name"] == sys.argv[1]), ""))' "$name")
          if [ -n "$existing_id" ]; then
            printf 'Replacing existing draft asset %s.\n' "$name"
            curl -fsS -X DELETE \
              -H "$auth_header" \
              -H "Accept: application/vnd.github+json" \
              "$api_base/assets/$existing_id"
          fi

          status=$(
            curl -sS \
              -o upload.json \
              -w '%{http_code}' \
              -X POST \
              -H "$auth_header" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$asset" \
              "$upload_url?name=$name&label=$name"
          )

          case "$status" in
            201) printf 'Uploaded %s\n' "$name" ;;
            *) printf 'Failed to upload %s (HTTP %s).\n' "$name" "$status" >&2; cat upload.json >&2; exit 1 ;;
          esac

  checksums:
    needs: [detect, create-release, release-x86_64, release-aarch64]
    if: needs.detect.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04-arm
    container:
      image: mere/ci:v0.18.6
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Upload SHA256SUMS to draft release
        env:
          X86_CHECKSUM: ${{ needs.release-x86_64.outputs.checksum }}
          AARCH64_CHECKSUM: ${{ needs.release-aarch64.outputs.checksum }}
        run: |
          set -eu

          printf '%s\n' "$X86_CHECKSUM" "$AARCH64_CHECKSUM" > SHA256SUMS

          api_base="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases"
          auth_header="Authorization: Bearer $GH_TOKEN"
          release_id="${{ needs.create-release.outputs.release_id }}"
          upload_url="${{ needs.create-release.outputs.upload_url }}"
          curl -fsS \
            -H "$auth_header" \
            -H "Accept: application/vnd.github+json" \
            "$api_base/$release_id" > release.json

          existing_id=$(python3 -c 'import json; assets=json.load(open("release.json"))["assets"]; print(next((str(a["id"]) for a in assets if a["name"] == "SHA256SUMS"), ""))')
          if [ -n "$existing_id" ]; then
            printf '%s\n' 'Replacing existing draft SHA256SUMS.'
            curl -fsS -X DELETE \
              -H "$auth_header" \
              -H "Accept: application/vnd.github+json" \
              "$api_base/assets/$existing_id"
          fi

          status=$(
            curl -sS \
              -o upload.json \
              -w '%{http_code}' \
              -X POST \
              -H "$auth_header" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @SHA256SUMS \
              "$upload_url?name=SHA256SUMS&label=SHA256SUMS"
          )

          case "$status" in
            201) printf '%s\n' 'Uploaded SHA256SUMS' ;;
            *) printf 'Failed to upload SHA256SUMS (HTTP %s).\n' "$status" >&2; cat upload.json >&2; exit 1 ;;
          esac

  publish:
    needs: [detect, create-release, checksums]
    if: needs.detect.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04-arm
    container:
      image: mere/ci:v0.18.6
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish complete release
        run: |
          set -eu

          api_base="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases"
          auth_header="Authorization: Bearer $GH_TOKEN"
          tag="${{ needs.detect.outputs.tag }}"
          release_id="${{ needs.create-release.outputs.release_id }}"
          curl -fsS \
            -H "$auth_header" \
            -H "Accept: application/vnd.github+json" \
            "$api_base/$release_id" > release.json

          immutable=$(python3 -c 'import json; print(json.load(open("release.json")).get("immutable", False))')
          draft=$(python3 -c 'import json; print(json.load(open("release.json"))["draft"])')
          if [ "$immutable" = "True" ]; then
            printf 'Release %s is already immutable; refusing to modify it.\n' "$tag" >&2
            exit 1
          fi
          if [ "$draft" != "True" ]; then
            printf 'Release %s is already published.\n' "$tag"
            exit 0
          fi

          curl -fsS \
            -X PATCH \
            -H "$auth_header" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data '{"draft":false}' \
            "$api_base/$release_id" >/dev/null
          printf 'Published complete release %s.\n' "$tag"
