on:
  push:
    branches:
      - main
    paths:
      - build.zig.zon
  workflow_dispatch:

jobs:
  detect:
    runs-on: docker
    container:
      image: mere/zig
    outputs:
      version_changed: ${{ steps.meta.outputs.version_changed }}
      version: ${{ steps.meta.outputs.version }}
      old_version: ${{ steps.meta.outputs.old_version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      changelog: ${{ steps.meta.outputs.changelog }}
    steps:
      - name: Git checkout
        run: |
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c http.extraHeader="Authorization: Bearer $GITHUB_TOKEN" \
            fetch --tags origin
          git -c http.extraHeader="Authorization: Bearer $GITHUB_TOKEN" \
            fetch --depth=50 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Detect version change
        id: meta
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"

          previous_file=
          if git rev-parse --verify "$GITHUB_SHA^" >/dev/null 2>&1; then
            git show "$GITHUB_SHA^:build.zig.zon" > previous-build.zig.zon
            previous_file=previous-build.zig.zon
          fi

          sh .forgejo/scripts/release-ci.sh detect-version-change build.zig.zon "$previous_file" \
            >> "$GITHUB_OUTPUT"

          changelog=$(sh .forgejo/scripts/release-ci.sh changelog)
          {
            printf 'changelog<<EOF\n'
            printf '%s\n' "$changelog"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: No release needed
        if: ${{ steps.meta.outputs.version_changed != 'true' }}
        run: |
          echo "build.zig.zon changed, but .version did not change."

  release-x86_64:
    needs: detect
    if: needs.detect.outputs.version_changed == 'true'
    runs-on: docker
    container:
      image: mere/zig
    outputs:
      checksum: ${{ steps.build.outputs.checksum }}
    steps:
      - name: Git checkout
        run: |
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c http.extraHeader="Authorization: Bearer $GITHUB_TOKEN" \
            fetch --depth=50 --tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Test
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          zig build test --summary all

      - name: Build and package
        id: build
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"

          version="${{ needs.detect.outputs.version }}"
          arch=$(uname -m)
          base=$(sh .forgejo/scripts/release-ci.sh asset-base "$version" linux "$arch")

          zig build -Doptimize=ReleaseSmall
          mkdir -p dist
          cp zig-out/bin/mere "dist/${base}"

          checksum=$(cd dist && sha256sum "$base")
          printf 'checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"

      - name: Push release tag
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"

          git config user.name "Mere CI"
          git config user.email "no-reply@merelinux.org"

          tag="${{ needs.detect.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            printf 'Tag %s already exists on origin.\n' "$tag"
            exit 0
          fi

          git tag -a "$tag" -m "${{ needs.detect.outputs.release_name }}" "$GITHUB_SHA"
          git -c http.extraHeader="Authorization: Bearer $GITHUB_TOKEN" \
            push origin "refs/tags/${tag}"

      - name: Create release and upload assets
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"

          api_base="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases"
          auth_header="Authorization: token $GITHUB_TOKEN"
          tag="${{ needs.detect.outputs.tag }}"
          version="${{ needs.detect.outputs.version }}"

          release_status=$(
            curl -sS \
              -o release.json \
              -w '%{http_code}' \
              -H "$auth_header" \
              -H "Accept: application/json" \
              "$api_base/tags/$tag"
          )

          case "$release_status" in
            200)
              printf 'Release %s already exists; reusing it.\n' "$tag"
              ;;
            404)
              body=$(printf '%s' "${{ needs.detect.outputs.changelog }}" | sed 's/\\/\\\\/g; s/"/\\"/g; s/$/\\n/' | tr -d '\n' | sed 's/\\n$//')
              printf '%s\n' \
                "{\"tag_name\":\"$tag\",\"target_commitish\":\"$GITHUB_SHA\",\"name\":\"mere $version\",\"body\":\"$body\",\"draft\":false,\"prerelease\":false}" \
                > release-create.json

              curl -fsS \
                -X POST \
                -H "$auth_header" \
                -H "Accept: application/json" \
                -H "Content-Type: application/json" \
                --data-binary @release-create.json \
                "$api_base" > release.json
              ;;
            *)
              printf 'Failed to query release %s (HTTP %s).\n' "$tag" "$release_status" >&2
              cat release.json >&2
              exit 1
              ;;
          esac

          release_id=$(
            grep -o '"id":[[:space:]]*[0-9][0-9]*' release.json \
              | head -n 1 \
              | sed 's/[^0-9]//g'
          )

          if [ -z "$release_id" ]; then
            printf '%s\n' "Failed to parse release id from API response." >&2
            cat release.json >&2
            exit 1
          fi

          for asset in dist/*; do
            name=$(basename "$asset")
            status=$(
              curl -sS \
                -o upload.json \
                -w '%{http_code}' \
                -X POST \
                -H "$auth_header" \
                -H "Accept: application/json" \
                -F "attachment=@${asset}" \
                "$api_base/$release_id/assets?name=$name"
            )

            case "$status" in
              201)
                printf 'Uploaded %s\n' "$name"
                ;;
              409)
                printf 'Asset %s already exists; skipping.\n' "$name"
                ;;
              *)
                printf 'Failed to upload %s (HTTP %s).\n' "$name" "$status" >&2
                cat upload.json >&2
                exit 1
                ;;
            esac
          done

  release-aarch64:
    needs:
      - detect
      - release-x86_64
    if: needs.detect.outputs.version_changed == 'true'
    runs-on: docker-aarch64
    container:
      image: mere/zig
    outputs:
      checksum: ${{ steps.build.outputs.checksum }}
    steps:
      - name: Git checkout
        run: |
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c http.extraHeader="Authorization: Bearer $GITHUB_TOKEN" \
            fetch --depth=50 --tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Build and package
        id: build
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"

          version="${{ needs.detect.outputs.version }}"
          arch=$(uname -m)
          base=$(sh .forgejo/scripts/release-ci.sh asset-base "$version" linux "$arch")

          zig build -Doptimize=ReleaseSmall
          mkdir -p dist
          cp zig-out/bin/mere "dist/${base}"

          checksum=$(cd dist && sha256sum "$base")
          printf 'checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"

      - name: Upload assets
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"

          api_base="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases"
          auth_header="Authorization: token $GITHUB_TOKEN"
          tag="${{ needs.detect.outputs.tag }}"

          release_status=$(
            curl -sS \
              -o release.json \
              -w '%{http_code}' \
              -H "$auth_header" \
              -H "Accept: application/json" \
              "$api_base/tags/$tag"
          )

          if [ "$release_status" != "200" ]; then
            printf 'Release %s not found (HTTP %s).\n' "$tag" "$release_status" >&2
            exit 1
          fi

          release_id=$(
            grep -o '"id":[[:space:]]*[0-9][0-9]*' release.json \
              | head -n 1 \
              | sed 's/[^0-9]//g'
          )

          for asset in dist/*; do
            name=$(basename "$asset")
            status=$(
              curl -sS \
                -o upload.json \
                -w '%{http_code}' \
                -X POST \
                -H "$auth_header" \
                -H "Accept: application/json" \
                -F "attachment=@${asset}" \
                "$api_base/$release_id/assets?name=$name"
            )

            case "$status" in
              201)
                printf 'Uploaded %s\n' "$name"
                ;;
              409)
                printf 'Asset %s already exists; skipping.\n' "$name"
                ;;
              *)
                printf 'Failed to upload %s (HTTP %s).\n' "$name" "$status" >&2
                cat upload.json >&2
                exit 1
                ;;
            esac
          done

  checksums:
    needs:
      - detect
      - release-x86_64
      - release-aarch64
    if: needs.detect.outputs.version_changed == 'true'
    runs-on: docker
    container:
      image: mere/zig
    steps:
      - name: Upload SHA256SUMS
        run: |
          set -eu

          printf '%s\n' \
            "${{ needs.release-x86_64.outputs.checksum }}" \
            "${{ needs.release-aarch64.outputs.checksum }}" \
            > SHA256SUMS

          api_base="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases"
          auth_header="Authorization: token $GITHUB_TOKEN"
          tag="${{ needs.detect.outputs.tag }}"

          curl -fsS \
            -H "$auth_header" \
            -H "Accept: application/json" \
            "$api_base/tags/$tag" > release.json

          release_id=$(
            grep -o '"id":[[:space:]]*[0-9][0-9]*' release.json \
              | head -n 1 \
              | sed 's/[^0-9]//g'
          )

          status=$(
            curl -sS \
              -o upload.json \
              -w '%{http_code}' \
              -X POST \
              -H "$auth_header" \
              -H "Accept: application/json" \
              -F "attachment=@SHA256SUMS" \
              "$api_base/$release_id/assets?name=SHA256SUMS"
          )

          case "$status" in
            201)
              printf 'Uploaded SHA256SUMS\n'
              ;;
            409)
              printf 'SHA256SUMS already exists; skipping.\n'
              ;;
            *)
              printf 'Failed to upload SHA256SUMS (HTTP %s).\n' "$status" >&2
              cat upload.json >&2
              exit 1
              ;;
          esac
